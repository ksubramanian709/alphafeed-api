services:
  - type: web
    name: alphafeed-api
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /v1/health
    envVars:
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: MARKETDATA_TOKEN
        sync: false
